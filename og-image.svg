<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="448" cy="158" r="59" fill="#4338ca" opacity="0.12"/>
    <circle cx="223" cy="292" r="28" fill="#4338ca" opacity="0.19"/>
    <circle cx="1164" cy="621" r="57" fill="#4338ca" opacity="0.07"/>
    <circle cx="959" cy="239" r="70" fill="#4338ca" opacity="0.15"/>
    <circle cx="11" cy="402" r="39" fill="#4338ca" opacity="0.16"/>
    <circle cx="310" cy="549" r="50" fill="#4338ca" opacity="0.14"/>
    <rect x="1265" y="214" width="94" height="87" rx="8" fill="#4f46e5" opacity="0.07" transform="rotate(40, 610, 684)"/>
    <rect x="1286" y="-76" width="71" height="88" rx="8" fill="#4f46e5" opacity="0.09" transform="rotate(24, 332, 44)"/>
    <rect x="853" y="261" width="88" height="35" rx="8" fill="#4f46e5" opacity="0.05" transform="rotate(44, 573, 417)"/>
    <rect x="1114" y="-4" width="25" height="89" rx="8" fill="#4f46e5" opacity="0.06" transform="rotate(28, 1117, 149)"/>
    <rect x="-91" y="-9" width="60" height="44" rx="8" fill="#4f46e5" opacity="0.09" transform="rotate(37, 101, 688)"/>
    <rect x="-86" y="55" width="84" height="79" rx="8" fill="#4f46e5" opacity="0.05" transform="rotate(2, 691, -68)"/>
    <rect x="1201" y="327" width="33" height="48" rx="8" fill="#4f46e5" opacity="0.13" transform="rotate(20, 945, 399)"/>
    <rect x="482" y="488" width="96" height="89" rx="8" fill="#4f46e5" opacity="0.12" transform="rotate(37, 565, -54)"/>
    <polygon points="1045,546 1114,684 976,684" fill="#4338ca" opacity="0.08"/>
    <polygon points="291,488 332,570 250,570" fill="#4338ca" opacity="0.11"/>
    <polygon points="-69,179 25,367 -163,367" fill="#4338ca" opacity="0.08"/>
    <polygon points="508,358 574,490 442,490" fill="#4338ca" opacity="0.09"/>

  <!-- Wave at bottom -->
  <path d="M0,532 C360,581 840,483 1200,532 L1200,630 L0,630Z" fill="#4338ca" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Kyoto temple 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Kyoto — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#818cf8" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Kyoto Kyoto temple 안내 — 정보
  </text>
</svg>